name: BAF

on:
  push:
    branches: [main]
    paths:
      - src/fraudops/baf.py
      - src/fraudops/fairness.py
      - .github/workflows/baf.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baf

jobs:
  baf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: make install PYTHON=python
      # the data stays on the runner, it is never committed or uploaded
      - name: Download BAF from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pipx run --spec kaggle==2.2.4 kaggle datasets download \
            sgpjesus/bank-account-fraud-dataset-neurips-2022 -f Base.csv -p data/baf
          cd data/baf
          if [ -f Base.csv.zip ]; then unzip -o Base.csv.zip; fi
          test -f Base.csv
      - run: make baf
      - uses: actions/upload-artifact@v7
        with:
          name: baf-lightgbm-model
          path: data/baf/lightgbm.txt
          retention-days: 90
      - name: Publish metrics and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/baf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "maj résultats baf"
          git pull --rebase
          git push
