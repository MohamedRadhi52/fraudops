name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: make install PYTHON=python
      - run: make lint
      - run: make test
